# yaml-language-server: $schema=https://slide-spec.dev/schema/presentation.schema.json
schemaVersion: 1
presentation:
  id: 2025-open-source-example
  year: 2025
  title: "Vortex CLI: Q1 2025"
  subtitle: Open Source Update
  slides:
    - template: hero
      enabled: true
      content:
        title_primary: Vortex
        title_accent: CLI
        subtitle_prefix: Q1 2025
        quote: Build tools should be invisible. When they work well, you forget they are there.
    - template: agenda
      enabled: true
      title: Agenda
      subtitle: What this update covers
      content:
        card_arrow_fa_icon: fa-arrow-right
    - template: section-list-grid
      enabled: true
      title: What shipped
      subtitle: Highlights from the past quarter
      content:
        sections:
          - title: Plugin system
            fa_icon: fa-code-branch
            bullets:
              - Local plugins resolve from the project directory
              - Registry plugins install from the public catalog
              - Lifecycle hooks for init, build, and deploy phases
          - title: Error messages
            fa_icon: fa-bug
            bullets:
              - Structured output with error codes and fix suggestions
              - Links to relevant documentation in every error
              - Machine-readable JSON output for CI pipelines
          - title: Shell completions
            fa_icon: fa-wrench
            bullets:
              - Auto-generated completions for bash, zsh, and fish
              - Dynamic completions for project-specific commands
              - Installable via a single CLI command
    - template: timeline
      enabled: true
      title: Releases
      subtitle: Tagged versions from Q1
      content:
        latest_badge_label: Latest
        footer_link_label: All releases on GitHub
        latest_release_fa_icon: fa-tag
        release_fa_icon: fa-code-branch
        featured_release_ids:
          - v3-2-0
          - v3-1-0
    - template: section-title
      enabled: true
      content:
        title: Delivery Highlights
        subtitle: The themes that shaped Q1
        image_url: content/assets/slide-spec-logo.svg
        image_alt: Vortex CLI mark
    - template: progress-timeline
      enabled: true
      title: "Roadmap: Completed"
      subtitle: What we shipped
      content:
        stage: completed
        footer_link_label: View full roadmap
        stages:
          completed:
            label: Completed
            summary: Shipped in Q1 2025.
          in-progress:
            label: In Progress
            summary: Active work continuing into Q2.
          planned:
            label: Planned
            summary: Scoped for Q2 2025.
        sections:
          - title: Shipped
            fa_icon: fa-check
            type: richtext
            body: |-
              - Plugin system with local and registry-based resolution
              - Structured error messages with fix suggestions
              - Shell completion for bash, zsh, and fish
          - title: Themes
            fa_icon: fa-bullseye
            type: keyvalue
            separator_fa_icon: fa-chevron-right
            body:
              - key: Extensibility
                value: Let users add functionality without forking.
              - key: Developer Experience
                value: Reduce time-to-fix for common errors.
    - template: people
      enabled: true
      title: Contributor spotlight
      subtitle: People who made Q1 happen
      content:
        banner_prefix: Thanks to all
        contributors_link_label: contributors
        banner_suffix: who helped shape this release.
        quote_fa_icon: fa-quote-left
        spotlight:
          - login: sarah-plugins
            fa_icon: fa-user-astronaut
            summary: Designed and implemented the plugin resolution system from scratch.
          - login: kai-errors
            summary: Rewrote the error pipeline to include structured codes and fix suggestions.
          - login: mina-shells
            summary: Added shell completion generators for all three supported shells.
    - template: metrics-and-links
      enabled: true
      title: Community health
      subtitle: Growth signals from Q1
      content:
        section_heading: In the wild
        stats_heading: This quarter
        trend_suffix: vs last quarter
        show_deltas: true
        stat_fa_icons:
          - fa-star
          - fa-check-circle
          - fa-code-branch
          - fa-user-plus
        stat_keys:
          - stars
          - issues_closed
          - prs_merged
          - new_contributors
        mentions:
          - type: Blog post
            fa_icon: fa-rss
            title: How we built the Vortex plugin system
            url_label: Read on the blog
            url: https://vortex-cli.example.com/blog/plugin-system
          - type: Conference talk
            title: "DevTools Conf: Building extensible CLIs"
            url_label: Watch the recording
            url: https://example.com/talks/extensible-clis
    - template: image-and-bullets
      enabled: true
      title: Q1 Snapshot
      subtitle: One visual and the top outcomes
      content:
        image_side: right
        image:
          src: content/assets/slide-spec-logo.svg
          alt: Vortex CLI quarterly snapshot visual
          description: Quarterly summary visual used in the open-source update.
        bullets:
          - Plugin system shipped with local and registry-based resolution.
          - Structured error messages now include fix suggestions and docs links.
          - Shell completion support landed for bash, zsh, and fish.
    - template: card-grid
      enabled: true
      title: Maintainer focus areas
      subtitle: Authored topic cards using the agenda visual style
      content:
        card_arrow_fa_icon: fa-arrow-right
        items:
          - title: Plugin registry hardening
            fa_icon: fa-shield-halved
            url: https://vortex-cli.example.com/roadmap/plugins
          - title: Error-code taxonomy
            marker_text: E
          - title: Shell integration tests
            fa_icon: fa-check
          - title: Community plugin docs
            marker_text: D
    - template: action-cards
      enabled: true
      title: Get involved
      subtitle: Ways to contribute this quarter
      content:
        footer_text: Every contribution matters, no matter the size.
        footer_link_enabled: false
        cards:
          - title: Write a plugin
            fa_icon: fa-code
            description: Build a plugin and publish it to the registry. The plugin guide has templates to get started.
            url_label: Plugin guide
            url: https://vortex-cli.example.com/docs/plugins
          - title: Improve docs
            fa_icon: fa-book
            description: Help us write better guides, fix typos, or add examples for common workflows.
            url_label: Docs backlog
            url: https://github.com/example/vortex-cli/issues?q=label%3Adocs
          - title: Report bugs
            fa_icon: fa-bug
            description: Found something broken? File an issue with reproduction steps and we will prioritize it.
    - template: closing
      enabled: true
      content:
        heading: Thank you
        message: Vortex CLI is built by its community. Every issue, PR, and plugin makes it better for everyone.
        quote: Ship tools, not tickets.
        repository_fa_icon: fa-github
        docs_fa_icon: fa-book
        community_fa_icon: fa-users
