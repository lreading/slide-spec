name: Reusable Quality

on:
  workflow_call:
    inputs:
      run-dependency-review:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: App Content
            command: pnpm --filter @slide-spec/app validate:content
          - name: App Lint
            command: pnpm --filter @slide-spec/app lint
          - name: App Typecheck
            command: pnpm --filter @slide-spec/app typecheck
          - name: App Build
            command: pnpm --filter @slide-spec/app build:site
          - name: App Unit Tests
            command: pnpm --filter @slide-spec/app coverage
          - name: App E2E
            command: pnpm --filter @slide-spec/app e2e
            playwright: app
          - name: App A11y
            command: pnpm --filter @slide-spec/app a11y
            playwright: app
          - name: App Visual
            command: pnpm --filter @slide-spec/app visual
            playwright: app
          - name: Shared Lint
            command: pnpm --filter @slide-spec/shared lint
          - name: Shared Typecheck
            command: pnpm --filter @slide-spec/shared typecheck
          - name: Shared Unit Tests
            command: pnpm --filter @slide-spec/shared coverage
          - name: CLI Lint
            command: pnpm --filter @slide-spec/cli lint
          - name: CLI Typecheck
            command: pnpm --filter @slide-spec/cli typecheck
          - name: CLI Build
            command: pnpm --filter @slide-spec/cli build
          - name: CLI Package
            command: pnpm --filter @slide-spec/cli package:verify
          - name: CLI Unit Tests
            command: pnpm --filter @slide-spec/cli coverage
          - name: CLI E2E
            command: pnpm --filter @slide-spec/cli e2e
          - name: Docs A11y
            command: pnpm --filter @slide-spec/docs a11y
            playwright: docs
            ci: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - if: ${{ matrix.playwright == 'app' }}
        run: pnpm --filter @slide-spec/app exec playwright install --with-deps chromium
      - if: ${{ matrix.playwright == 'docs' }}
        run: pnpm --filter @slide-spec/docs exec playwright install chromium --with-deps
      - run: ${{ matrix.command }}
        env:
          CI: ${{ matrix.ci }}

  cli-connector-e2e:
    name: CLI Connector E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slide-spec/cli e2e:connectors
        env:
          CI: true
          GH_TOKEN: ${{ github.token }}

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:markdown

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spellcheck

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: DOCS_SITE_URL=http://127.0.0.1:4174 pnpm --filter @slide-spec/docs build
      - run: pnpm exec http-server ./docs/.vitepress/dist -p 4174 >/tmp/slide-spec-docs.log 2>&1 &
      - run: sleep 2
      - id: lychee-cache-bucket
        run: echo "bucket=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: restore-lychee-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-v1-${{ steps.lychee-cache-bucket.outputs.bucket }}
          restore-keys: |
            lychee-${{ runner.os }}-v1-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 14d --verbose --no-progress --config .github/lychee.toml "./README.md"
          fail: true
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 14d --verbose --no-progress --config .github/lychee.toml --base-url "http://127.0.0.1:4174/" "./docs/.vitepress/dist/**/*.html"
          fail: true
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-lychee-cache.outputs.cache-primary-key }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm run security:trivy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm run security:semgrep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm run security:gitleaks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: SLIDE_SPEC_DEPLOYMENT_URL=http://127.0.0.1:4173 SLIDE_SPEC_SITEMAP_ENABLED=true pnpm --filter @slide-spec/app build
      - run: pnpm exec http-server ./app/dist -p 4173 >/tmp/slide-spec-app.log 2>&1 &
      - run: sleep 2
      - run: mkdir -p dast-report && chmod 777 dast-report
      - run: >
          docker run --rm --network host --user root
          -v "${PWD}/.github:/zap/config:ro"
          -v "${PWD}/dast-report:/zap/wrk:rw"
          ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py
          -t http://127.0.0.1:4173
          -c /zap/config/zap-baseline.conf
          -J zap-report.json
          -w zap-warnings.md
          -I
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dast-report
          path: |
            dast-report/zap-report.json
            dast-report/zap-warnings.md

  dependency-review:
    if: inputs.run-dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
