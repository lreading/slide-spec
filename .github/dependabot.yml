version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      app-dependencies:
        applies-to: version-updates
        patterns:
          - "@vue/test-utils"
          - "@vue/tsconfig"
          - "eslint-plugin-vue"
          - "jsdom"
          - "vue-eslint-parser"
          - "vue-tsc"
        update-types:
          - minor
          - patch
      cli-dependencies:
        applies-to: version-updates
        patterns:
          - "dotenv"
          - "esbuild"
        update-types:
          - minor
          - patch
      docs-dependencies:
        applies-to: version-updates
        patterns:
          - "vitepress"
        update-types:
          - minor
          - patch
      shared-dependencies:
        applies-to: version-updates
        patterns:
          - "ajv"
          - "yaml-language-server"
        update-types:
          - minor
          - patch
      common-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
      github-actions-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
      github-actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
